<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="thermoGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="840" height="450" rx="14" fill="url(#bgGrad3)" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="420" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Lämpötila-asteikot: Celsius (°C) ja Kelvin (K)</text>
  <text x="420" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748b">Kelvin on fysiikan SI-perusyksikkö, jonka nollakohtana on absoluuttinen nollapiste</text>

  <!-- Thermometer graphic -->
  <g transform="translate(390, 85)">
    <!-- Tube background -->
    <rect x="20" y="20" width="20" height="290" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <!-- Liquid fill -->
    <rect x="23" y="25" width="14" height="282" rx="7" fill="url(#thermoGrad)"/>
    <!-- Bulb at bottom -->
    <circle cx="30" cy="320" r="24" fill="#0284c7" stroke="#0369a1" stroke-width="3"/>
    <circle cx="26" cy="316" r="6" fill="#7dd3fc" opacity="0.6"/>
  </g>

  <!-- Left: Celsius scale -->
  <g transform="translate(180, 85)">
    <text x="180" y="15" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#0369a1">Celsius-asteikko [°C]</text>
    
    <!-- 100 °C -->
    <line x1="160" y1="50" x2="230" y2="50" stroke="#ef4444" stroke-width="2"/>
    <text x="150" y="55" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#dc2626">+100 °C</text>
    <text x="150" y="70" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Veden kiehumispiste</text>

    <!-- 37 °C -->
    <line x1="170" y1="120" x2="230" y2="120" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="160" y="124" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#d97706">+37 °C</text>
    <text x="160" y="137" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Ihmisen ruumiinlämpö</text>

    <!-- 20 °C -->
    <line x1="170" y1="150" x2="230" y2="150" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="160" y="154" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#2563eb">+20 °C</text>
    <text x="160" y="167" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Huoneenlämpötila</text>

    <!-- 0 °C -->
    <line x1="160" y1="185" x2="230" y2="185" stroke="#0284c7" stroke-width="2"/>
    <text x="150" y="190" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#0284c7">0 °C</text>
    <text x="150" y="205" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Veden jäätymispiste / jään sulaminen</text>

    <!-- -273.15 °C -->
    <line x1="160" y1="300" x2="230" y2="300" stroke="#7c3aed" stroke-width="2"/>
    <text x="150" y="303" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#6d28d9">-273,15 °C</text>
    <text x="150" y="320" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#7c3aed">Absoluuttinen nollapiste</text>
    <text x="150" y="333" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Kaikki lämpöliike pysähtyy</text>
  </g>

  <!-- Right: Kelvin scale -->
  <g transform="translate(450, 85)">
    <text x="20" y="15" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#7c3aed">Kelvin-asteikko [K]</text>

    <!-- 373.15 K -->
    <line x1="-10" y1="50" x2="60" y2="50" stroke="#ef4444" stroke-width="2"/>
    <text x="70" y="55" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#dc2626">373,15 K</text>
    <text x="70" y="70" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">100 + 273,15</text>

    <!-- 310.15 K -->
    <line x1="-10" y1="120" x2="50" y2="120" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="60" y="124" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#d97706">310,15 K</text>

    <!-- 293.15 K -->
    <line x1="-10" y1="150" x2="50" y2="150" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="60" y="154" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#2563eb">293,15 K</text>

    <!-- 273.15 K -->
    <line x1="-10" y1="185" x2="60" y2="185" stroke="#0284c7" stroke-width="2"/>
    <text x="70" y="190" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#0284c7">273,15 K</text>
    <text x="70" y="205" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">0 + 273,15</text>

    <!-- 0 K -->
    <line x1="-10" y1="300" x2="60" y2="300" stroke="#7c3aed" stroke-width="2"/>
    <text x="70" y="303" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#6d28d9">0 K</text>
    <text x="70" y="320" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#7c3aed">Absoluuttinen nolla</text>
    <text x="70" y="333" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Ei negatiivisia arvoja!</text>
  </g>

  <!-- Formula banner at bottom -->
  <g transform="translate(140, 385)">
    <rect width="560" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow3)"/>
    <text x="280" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0f172a">
      Asteikkomuunnos:  T(K) = t(°C) + 273,15    sekä    t(°C) = T(K) - 273,15
    </text>
    <text x="280" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">
      Asteen suuruus on molemmissa sama: 1 °C muutos vastaa tasan 1 K muutosta (ΔT = Δt)
    </text>
  </g>
</svg>