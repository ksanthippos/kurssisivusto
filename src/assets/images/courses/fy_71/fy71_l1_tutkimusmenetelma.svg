<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="840" height="420" rx="14" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Title -->
  <text x="420" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Fysiikan kokeellinen tutkimusmenetelmä</text>
  <text x="420" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748b">Luonnonilmiöistä mittauksiin ja matemaattisiin malleihin</text>

  <!-- Step 1: Havainto -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="140" height="110" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="70" cy="32" r="18" fill="#eff6ff"/>
    <text x="70" y="38" text-anchor="middle" font-size="18">👀</text>
    <text x="70" y="66" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#1e3a8a">1. Havainto</text>
    <text x="70" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Luonnonilmiö tai</text>
    <text x="70" y="99" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">kysymys / ongelma</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="185" y1="150" x2="225" y2="150" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 2: Hypoteesi -->
  <g transform="translate(235, 95)" filter="url(#shadow)">
    <rect width="140" height="110" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="70" cy="32" r="18" fill="#eff6ff"/>
    <text x="70" y="38" text-anchor="middle" font-size="18">💡</text>
    <text x="70" y="66" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#1e3a8a">2. Hypoteesi</text>
    <text x="70" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Oletus tai malli</text>
    <text x="70" y="99" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">ilmiön syystä</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="380" y1="150" x2="420" y2="150" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 3: Koe & Mittaukset -->
  <g transform="translate(430, 95)" filter="url(#shadow)">
    <rect width="160" height="110" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="80" cy="32" r="18" fill="#eff6ff"/>
    <text x="80" y="38" text-anchor="middle" font-size="18">🔬</text>
    <text x="80" y="66" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#1e3a8a">3. Koe &amp; Mittaus</text>
    <text x="80" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Toistettava koe,</text>
    <text x="80" y="99" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">mittausdata ja taulukointi</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="595" y1="150" x2="635" y2="150" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 4: Analyysi -->
  <g transform="translate(645, 95)" filter="url(#shadow)">
    <rect width="155" height="110" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="77" cy="32" r="18" fill="#eff6ff"/>
    <text x="77" y="38" text-anchor="middle" font-size="18">📊</text>
    <text x="77" y="66" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#1e3a8a">4. Analyysi</text>
    <text x="77" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Vastaako tulos</text>
    <text x="77" y="99" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">hypoteesia?</text>
  </g>

  <!-- Decision path downwards -->
  <!-- Success: YES -> Luonnonlaki -->
  <line x1="722" y1="210" x2="722" y2="280" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <rect x="665" y="230" width="115" height="22" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="722" y="245" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#15803d">KYLLÄ: Vahvistus</text>

  <g transform="translate(620, 290)" filter="url(#shadow)">
    <rect width="200" height="95" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <circle cx="100" cy="28" r="16" fill="#dcfce7"/>
    <text x="100" y="34" text-anchor="middle" font-size="16">📜</text>
    <text x="100" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#166534">5. Luonnonlaki / Malli</text>
    <text x="100" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#15803d">Matemaattinen kaava tai teoria,</text>
    <text x="100" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#15803d">joka ennustaa uusia ilmiöitä</text>
  </g>

  <!-- Fail: NO -> Takaisin hypoteesiin -->
  <path d="M 645 160 L 615 160 C 615 250, 305 250, 305 220" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <rect x="415" y="240" width="150" height="24" rx="5" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="490" y="256" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#991b1b">EI: Korjataan hypoteesia ↺</text>

  <!-- Galileo quote / footer note -->
  <g transform="translate(40, 290)">
    <rect width="540" height="95" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Galileo Galilei (1564–1642): Kokeellisen fysiikan isä</text>
    <text x="20" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">"Mittaa sitä, mikä on mitattavissa, ja tee mitattavaksi se, mikä ei vielä ole."</text>
    <text x="20" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Pelkkä päättely ei riitä fysiikassa – luonnonlakien on aina perustuttava toistettaviin mittauksiin.</text>
  </g>
</svg>