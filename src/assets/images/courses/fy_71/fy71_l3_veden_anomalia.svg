<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="25%" stop-color="#bae6fd"/>
      <stop offset="60%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow7" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="840" height="400" rx="14" fill="url(#bgGrad7)" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="420" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#0f172a">Veden poikkeuksellinen lämpölaajeneminen (Veden anomalia)</text>
  <text x="420" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Vesi on tiheimmillään +4 °C lämpötilassa – siksi järvet jäätyvät pinnalta eikä pohjasta!</text>

  <!-- Left: Density graph -->
  <g transform="translate(60, 75)" filter="url(#shadow7)">
    <rect width="330" height="295" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="165" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0369a1">Veden tiheyskuvaaja</text>

    <!-- Axes -->
    <line x1="50" y1="240" x2="300" y2="240" stroke="#475569" stroke-width="2"/>
    <line x1="50" y1="240" x2="50" y2="45" stroke="#475569" stroke-width="2"/>
    <text x="300" y="255" text-anchor="end" font-family="sans-serif" font-size="11" fill="#475569">Lämpötila [°C]</text>
    <text x="45" y="40" text-anchor="start" font-family="sans-serif" font-size="11" fill="#475569">Tiheys ρ [kg/m³]</text>

    <!-- Temperature ticks -->
    <text x="90" y="256" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">0°</text>
    <line x1="90" y1="240" x2="90" y2="244" stroke="#475569"/>
    
    <text x="160" y="256" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#dc2626">+4°C</text>
    <line x1="160" y1="240" x2="160" y2="246" stroke="#dc2626" stroke-width="2"/>

    <text x="240" y="256" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">+10°C</text>
    <line x1="240" y1="240" x2="240" y2="244" stroke="#475569"/>

    <!-- Curve showing maximum at 4 C -->
    <path d="M 50 170 Q 90 145 120 100 Q 160 65 190 90 Q 240 140 290 200" fill="none" stroke="#0284c7" stroke-width="3"/>
    
    <!-- Peak marker -->
    <circle cx="160" cy="72" r="5" fill="#dc2626"/>
    <text x="160" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#dc2626">Maksimi: 1000 kg/m³</text>
    <line x1="160" y1="77" x2="160" y2="238" stroke="#dc2626" stroke-dasharray="3 3"/>

    <!-- Ice density step -->
    <rect x="50" y="200" width="40" height="40" fill="#e0f2fe" opacity="0.7"/>
    <text x="70" y="222" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#0369a1">Jää (0°C):</text>
    <text x="70" y="234" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0369a1">917 kg/m³</text>
  </g>

  <!-- Right: Winter lake diagram -->
  <g transform="translate(420, 75)" filter="url(#shadow7)">
    <rect width="360" height="295" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="180" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">Järven kerrostuminen talvipakkasella</text>

    <!-- Lake cross-section -->
    <g transform="translate(25, 40)">
      <!-- Air -->
      <rect width="310" height="30" fill="#f1f5f9" rx="4"/>
      <text x="155" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#475569">Ilman lämpötila: -20 °C (pakkanen)</text>

      <!-- Ice layer on top -->
      <rect y="35" width="310" height="26" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" rx="2"/>
      <text x="155" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#0369a1">❄️ Jääkerros (0 °C) – kelluu pinnalla!</text>

      <!-- Water body gradient -->
      <rect y="65" width="310" height="150" fill="url(#waterGrad)" rx="2"/>

      <!-- Water layers -->
      <text x="25" y="88" font-family="sans-serif" font-size="11" font-weight="600" fill="#0369a1">+1 °C</text>
      <line x1="20" y1="95" x2="290" y2="95" stroke="#ffffff" stroke-dasharray="2 3" opacity="0.6"/>

      <text x="25" y="118" font-family="sans-serif" font-size="11" font-weight="600" fill="#0369a1">+2 °C</text>
      <line x1="20" y1="125" x2="290" y2="125" stroke="#ffffff" stroke-dasharray="2 3" opacity="0.6"/>

      <text x="25" y="148" font-family="sans-serif" font-size="11" font-weight="600" fill="#0c4a6e">+3 °C</text>
      <line x1="20" y1="155" x2="290" y2="155" stroke="#ffffff" stroke-dasharray="2 3" opacity="0.6"/>

      <!-- Bottom: +4 C with fish -->
      <text x="25" y="185" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">Pohjalla: +4 °C (tihein vesi painuu pohjaan)</text>
      <text x="240" y="195" font-size="20">🐟</text>
      <text x="180" y="200" font-size="16">🌿</text>
    </g>
  </g>
</svg>