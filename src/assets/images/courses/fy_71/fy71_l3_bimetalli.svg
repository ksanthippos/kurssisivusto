<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow6" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="360" rx="14" fill="url(#bgGrad6)" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="400" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#0f172a">Kaksoismetalliliuska eli bimetalliliuska</text>
  <text x="400" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Eri metallit laajenevat eri tavalla: kupari laajenee enemmän kuin rauta</text>

  <!-- Panel 1: Huoneenlämpö -->
  <g transform="translate(60, 80)" filter="url(#shadow6)">
    <rect width="320" height="175" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="160" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0369a1">Huoneenlämmössä (20 °C): Suora</text>
    
    <!-- Fixed base -->
    <rect x="25" y="45" width="20" height="80" fill="#475569" rx="3"/>
    
    <!-- Copper strip (top) -->
    <rect x="45" y="65" width="220" height="15" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
    <text x="155" y="77" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#78350f">Kupari (enemmän laajeneva)</text>
    
    <!-- Iron strip (bottom) -->
    <rect x="45" y="80" width="220" height="15" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>
    <text x="155" y="92" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1e293b">Rauta (vähemmän laajeneva)</text>

    <!-- Contact point -->
    <circle cx="280" cy="80" r="5" fill="#22c55e"/>
    <text x="280" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#15803d">Kytkin kiinni</text>

    <text x="160" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Molemmilla sama pituus levossa</text>
  </g>

  <!-- Panel 2: Kuumennettuna -->
  <g transform="translate(420, 80)" filter="url(#shadow6)">
    <rect width="320" height="175" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="160" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#dc2626">Kuumennettuna: Taipuu alaspäin</text>
    
    <!-- Fixed base -->
    <rect x="25" y="45" width="20" height="80" fill="#475569" rx="3"/>
    
    <!-- Curved copper strip (top) -->
    <path d="M 45 65 Q 160 70 240 120 L 235 133 Q 155 83 45 80 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
    
    <!-- Curved iron strip (bottom) -->
    <path d="M 45 80 Q 155 83 235 133 L 230 146 Q 150 96 45 95 Z" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>

    <!-- Contact gap -->
    <circle cx="280" cy="80" r="5" fill="#ef4444" stroke="#dc2626" stroke-width="1"/>
    <text x="280" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#dc2626">Kytkin auki!</text>

    <text x="160" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#b91c1c" font-weight="600">Kupari venyy pidemmäksi → pakottaa kaartumaan</text>
  </g>

  <!-- Application footnote -->
  <g transform="translate(60, 275)">
    <rect width="680" height="60" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Käytännön sovelluksia:</text>
    <text x="20" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Silitysraudan ja leivänpaahtimen termostaatit, perinteiset huonetermostaatit, palovaroittimen lämpökytkin.</text>
  </g>
</svg>