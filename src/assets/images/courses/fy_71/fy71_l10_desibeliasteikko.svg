<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="dbBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="45%" stop-color="#eab308"/>
      <stop offset="65%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow8" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="840" height="450" rx="14" fill="url(#bgGrad8)" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="420" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#0f172a">Äänenvoimakkuus ja desibeliasteikko (dB)</text>
  <text x="420" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Logaritminen asteikko: +10 dB tarkoittaa äänienergian kymmenkertaistumista!</text>

  <!-- Big Horizontal Colored Scale -->
  <g transform="translate(60, 75)">
    <rect width="720" height="24" rx="12" fill="url(#dbBarGrad)" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Danger markers -->
    <!-- 85 dB warning line -->
    <line x1="437" y1="26" x2="437" y2="55" stroke="#f97316" stroke-width="2.5"/>
    <rect x="360" y="56" width="155" height="20" rx="4" fill="#ffedd5" stroke="#fdba74"/>
    <text x="437" y="70" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#c2410c">85 dB: Kuulosuojainraja 🎧</text>

    <!-- 120-130 dB pain threshold -->
    <line x1="642" y1="26" x2="642" y2="55" stroke="#dc2626" stroke-width="2.5"/>
    <rect x="585" y="56" width="115" height="20" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="642" y="70" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#991b1b">130 dB: Kipukynnys ⚡</text>
  </g>

  <!-- Level Cards Grid (8 levels) -->
  <g transform="translate(60, 160)">
    <!-- 0-20 dB -->
    <g transform="translate(0, 0)" filter="url(#shadow8)">
      <rect width="170" height="120" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
      <rect width="170" height="24" rx="8" fill="#f0fdf4"/>
      <text x="85" y="16" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#15803d">0 – 20 dB</text>
      <text x="85" y="48" text-anchor="middle" font-size="22">🍃</text>
      <text x="85" y="74" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f172a">Kuulokynnys &amp; kuiskaus</text>
      <text x="85" y="92" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Lehtien havina,</text>
      <text x="85" y="106" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">äänetön huone</text>
    </g>

    <!-- 30-50 dB -->
    <g transform="translate(183, 0)" filter="url(#shadow8)">
      <rect width="170" height="120" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
      <rect width="170" height="24" rx="8" fill="#f0fdf4"/>
      <text x="85" y="16" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#15803d">30 – 50 dB</text>
      <text x="85" y="48" text-anchor="middle" font-size="22">📚</text>
      <text x="85" y="74" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f172a">Hiljainen ympäristö</text>
      <text x="85" y="92" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Kirjasto, hiljainen koti,</text>
      <text x="85" y="106" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">jääkaapin hurina</text>
    </g>

    <!-- 60-70 dB -->
    <g transform="translate(366, 0)" filter="url(#shadow8)">
      <rect width="170" height="120" rx="8" fill="#ffffff" stroke="#fef08a" stroke-width="1.5"/>
      <rect width="170" height="24" rx="8" fill="#fefce8"/>
      <text x="85" y="16" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#854d0e">60 – 70 dB</text>
      <text x="85" y="48" text-anchor="middle" font-size="22">🗣️</text>
      <text x="85" y="74" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f172a">Normaali puhe</text>
      <text x="85" y="92" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Keskustelu, luokkatila,</text>
      <text x="85" y="106" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">taustamusiikki</text>
    </g>

    <!-- 80-85 dB -->
    <g transform="translate(550, 0)" filter="url(#shadow8)">
      <rect width="170" height="120" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
      <rect width="170" height="24" rx="8" fill="#fff7ed"/>
      <text x="85" y="16" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#c2410c">80 – 85 dB</text>
      <text x="85" y="48" text-anchor="middle" font-size="22">🚗</text>
      <text x="85" y="74" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#c2410c">Kuulosuojausraja!</text>
      <text x="85" y="92" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Vilkas autoliikenne,</text>
      <text x="85" y="106" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">ruohonleikkuri (8 h raja)</text>
    </g>

    <!-- Row 2 -->
    <!-- 90-100 dB -->
    <g transform="translate(0, 135)" filter="url(#shadow8)">
      <rect width="170" height="120" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
      <rect width="170" height="24" rx="8" fill="#fff7ed"/>
      <text x="85" y="16" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#c2410c">90 – 100 dB</text>
      <text x="85" y="48" text-anchor="middle" font-size="22">🚜</text>
      <text x="85" y="74" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#9a3412">Kova melu</text>
      <text x="85" y="92" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Moottorisaha, traktori,</text>
      <text x="85" y="106" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">kuulovaurioriski jo 15 min!</text>
    </g>

    <!-- 100-115 dB -->
    <g transform="translate(183, 135)" filter="url(#shadow8)">
      <rect width="170" height="120" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
      <rect width="170" height="24" rx="8" fill="#fef2f2"/>
      <text x="85" y="16" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#dc2626">105 – 115 dB</text>
      <text x="85" y="48" text-anchor="middle" font-size="22">🎸</text>
      <text x="85" y="74" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b91c1c">Konsertti &amp; yökerho</text>
      <text x="85" y="92" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Kaiuttimen lähellä,</text>
      <text x="85" y="106" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#dc2626">tulpat pakolliset!</text>
    </g>

    <!-- 120-130 dB -->
    <g transform="translate(366, 135)" filter="url(#shadow8)">
      <rect width="170" height="120" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="2"/>
      <rect width="170" height="24" rx="8" fill="#fee2e2"/>
      <text x="85" y="16" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#b91c1c">120 – 130 dB</text>
      <text x="85" y="48" text-anchor="middle" font-size="22">✈️</text>
      <text x="85" y="74" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#991b1b">Kipukynnys!</text>
      <text x="85" y="92" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Suihkukone läheltä,</text>
      <text x="85" y="106" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">aiheuttaa kipua korvaan</text>
    </g>

    <!-- 140+ dB -->
    <g transform="translate(550, 135)" filter="url(#shadow8)">
      <rect width="170" height="120" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
      <rect width="170" height="24" rx="8" fill="#fee2e2"/>
      <text x="85" y="16" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#991b1b">140+ dB</text>
      <text x="85" y="48" text-anchor="middle" font-size="22">💥</text>
      <text x="85" y="74" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#7f1d1d">Välitön vaurio!</text>
      <text x="85" y="92" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Aseella ampuminen,</text>
      <text x="85" y="106" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f1d1d" font-weight="700">tärykalvo voi revetä</text>
    </g>
  </g>
</svg>