<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="340" rx="14" fill="url(#bgGrad4)" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="400" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Nestelämpömittarin rakenne ja toiminta</text>
  <text x="400" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Toiminta perustuu nesteen tilavuuden lämpölaajenemiseen kapeassa kapillaariputkessa</text>

  <!-- Horizontal Thermometer -->
  <g transform="translate(60, 110)">
    <!-- Glass outer tube -->
    <rect x="0" y="20" width="460" height="40" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow4)"/>
    <!-- Bulb on left -->
    <ellipse cx="25" cy="40" rx="30" ry="26" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>
    <ellipse cx="20" cy="34" rx="8" ry="6" fill="#fca5a5" opacity="0.6"/>

    <!-- Thin capillary tube inside -->
    <rect x="45" y="37" width="400" height="6" rx="3" fill="#e2e8f0"/>
    <!-- Liquid column in capillary -->
    <rect x="45" y="37" width="240" height="6" rx="3" fill="#dc2626"/>

    <!-- Ticks & numbers -->
    <!-- -20 -->
    <line x1="85" y1="20" x2="85" y2="30" stroke="#475569" stroke-width="1.5"/>
    <text x="85" y="14" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#475569">-20</text>
    <!-- 0 -->
    <line x1="165" y1="20" x2="165" y2="33" stroke="#0284c7" stroke-width="2"/>
    <text x="165" y="14" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#0284c7">0 °C</text>
    <!-- +20 -->
    <line x1="245" y1="20" x2="245" y2="30" stroke="#475569" stroke-width="1.5"/>
    <text x="245" y="14" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#475569">+20</text>
    <!-- +40 -->
    <line x1="325" y1="20" x2="325" y2="30" stroke="#475569" stroke-width="1.5"/>
    <text x="325" y="14" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#475569">+40</text>
    <!-- +60 -->
    <line x1="405" y1="20" x2="405" y2="30" stroke="#dc2626" stroke-width="2"/>
    <text x="405" y="14" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#dc2626">+60</text>
  </g>

  <!-- Explanatory Callouts -->
  <!-- Callout 1: Nestesäiliö -->
  <g transform="translate(60, 205)">
    <circle cx="20" cy="18" r="14" fill="#fee2e2"/>
    <text x="20" y="23" text-anchor="middle" font-size="14">🔴</text>
    <text x="42" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#991b1b">1. Nestesäiliö</text>
    <text x="42" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Sisältää mittausnesteen (nykyään</text>
    <text x="42" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">turvallista värjättyä etanolia).</text>
  </g>

  <!-- Callout 2: Kapillaariputki -->
  <g transform="translate(290, 205)">
    <circle cx="20" cy="18" r="14" fill="#eff6ff"/>
    <text x="20" y="23" text-anchor="middle" font-size="14">📏</text>
    <text x="42" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#1e40af">2. Kapea kapillaariputki</text>
    <text x="42" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Putki on hiuksenhieno: pienikin</text>
    <text x="42" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">tilavuuden muutos näkyy pitkänä patsaana.</text>
  </g>

  <!-- Callout 3: Lämpölaajeneminen -->
  <g transform="translate(540, 205)">
    <circle cx="20" cy="18" r="14" fill="#fefce8"/>
    <text x="20" y="23" text-anchor="middle" font-size="14">⚡</text>
    <text x="42" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#854d0e">3. Lämpölaajeneminen</text>
    <text x="42" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Lämmetessään neste laajenee ja nousee,</text>
    <text x="42" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">jäähtyessään kutistuu ja laskee.</text>
  </g>
</svg>